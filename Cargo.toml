[workspace]
resolver = "2"
members = [
    "exey-engine",
    "isometric-world-generator",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Exey Panteleev (original ExeyEngine 2014)", "Rust port"]

# Pin shared deps in one place so the engine and demo agree on versions.
[workspace.dependencies]
vulkanalia = { version = "0.35", features = ["libloading", "window"] }
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1.20", features = ["derive"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = "thin"
codegen-units = 1
